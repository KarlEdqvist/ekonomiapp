<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <style>
    body { font-family: Arial; margin: 40px; }
    textarea { width: 100%; height: 200px; }
    .result { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Ekonomiöversikt</h1>

  <p>Klistra in ditt kontoutdrag här:</p>
  <textarea id="rawInput"></textarea>
  <button onclick="processData()">Bearbeta</button>

  <div class="result" id="result"></div>

<script>
  // Exempel på kategoriregler
  const rules = {
    "ICA": "Livsmedel",
    "Coop": "Livsmedel",
    "Hemnet": "Boende",
    "Uber Eats": "Restaurang",
    "McDonalds": "Restaurang"
  };

 function processData() {
  const raw = document.getElementById("rawInput").value.trim();
  if (!raw) return;

  const lines = raw.split("\n");
  let results = [];

  for (let line of lines) {
    if (!line.trim()) continue;

    // Hantera CSV-rader korrekt (komma-separerade)
    // Delar med stöd för citattecken
    const parts = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);

    if (!parts) continue;

    /* Exempelstruktur:
       0: ID
       1: ? (kan vara saldo eller något bankinternt nummer)
       2: konto
       3: "Privatkonto"
       4: valuta
       5: bokföringsdatum
       6: transaktionsdatum
       7: värdedatum
       8: referens
       9: transaktionstext
       10: belopp
       11: saldo
    */

    const date = parts[5] || "";
    const text = parts[9]?.replace(/"/g, "") || "";
    const amount = parseFloat((parts[10] || "0").replace(",", "."));

    // REGEL-baserad matchning
    let category = "Okänd";
    for (let key in ruleCategories) {
      if (text.toUpperCase().includes(key)) {
        category = ruleCategories[key];
      }
    }

    // AI-gissning
    if (category === "Okänd") {
      category = aiGuessCategory(text);
    }

    results.push({ date, text, amount, category });
  }

  displayResults(results);
}
``

    // Visa resultat
    let html = "<h2>Resultat</h2><ul>";

    results.forEach(r => {
      html += `<li>${r.date}: ${r.text} — ${r.amount} kr (${r.category})</li>`;
    });

    html += "</ul>";
    document.getElementById("result").innerHTML = html;
  }
</script>

</body>

</html>
